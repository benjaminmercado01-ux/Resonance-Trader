services:
  - type: web
    name: coinsph-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: COINS_API_KEY
        sync: false
      - key: COINS_API_SECRET
        sync: false
